<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Location</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.12);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #1687ff;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        #status {
            margin-top: 20px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Share Your Location</h2>

    <p>
        This page will request your device location.
        Your coordinates will be sent by email only if you
        choose to allow location access.
    </p>

    <button onclick="requestLocation()">
        Share My Location
    </button>

    <div id="status"></div>

</div>

<script>

const status = document.getElementById("status");

// Put your Web3Forms access key here
const ACCESS_KEY = "YOUR_ACCESS_KEY_HERE";

function requestLocation() {

    if (!navigator.geolocation) {
        status.textContent =
            "Geolocation is not supported by this browser.";
        return;
    }

    status.textContent =
        "Requesting location permission...";

    navigator.geolocation.getCurrentPosition(
        sendLocation,
        locationError,
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}

async function sendLocation(position) {

    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;
    const accuracy = position.coords.accuracy;

    const mapsLink =
        `https://www.google.com/maps?q=${latitude},${longitude}`;

    status.textContent =
        "Location permission granted. Sending location...";

    const formData = new FormData();

    formData.append("access_key", ACCESS_KEY);
    formData.append(
        "subject",
        "Location Shared With Permission"
    );

    formData.append("Latitude", latitude);
    formData.append("Longitude", longitude);
    formData.append("Accuracy", accuracy + " meters");
    formData.append("Google Maps", mapsLink);

    try {

        const response = await fetch(
            "https://api.web3forms.com/submit",
            {
                method: "POST",
                body: formData
            }
        );

        const result = await response.json();

        if (result.success) {

            status.textContent =
                "Your location was successfully shared.";

        } else {

            status.textContent =
                "The location could not be sent.";

        }

    } catch (error) {

        status.textContent =
            "Network error. Please try again.";

    }
}

function locationError(error) {

    if (error.code === 1) {

        status.textContent =
            "Location permission was denied.";

    } else {

        status.textContent =
            "Unable to get your location.";

    }
}

</script>

</body>
</html>
